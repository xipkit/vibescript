name: X86 fallback diagnostic

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full baseline commit SHA
        required: true
        default: 7a3ba6469b50c5fa7b43764a70f6fc32d7fb3efa
      head_ref:
        description: Full candidate commit SHA
        required: true
        default: c31ea6888de0502612b07bcb759fa88b83f5e77d
      profile_only:
        description: Skip completed benchmark trials and capture CPU profiles
        type: boolean
        default: false
      full_matrix:
        description: Measure all public workloads including format and mixed strings
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIMD_BASE: ${{ inputs.base_ref }}
      SIMD_HEAD: ${{ inputs.head_ref }}
      SIMD_PROFILE_ONLY: ${{ inputs.profile_only }}
      SIMD_FULL_MATRIX: ${{ inputs.full_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref }}
          path: head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: head/go.sum
      - name: Compare and profile ordinary embedding executables
        run: python3 -u diagnostic/scripts/x86_fallback_measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-fallback-${{ github.run_id }}
          path: ${{ runner.temp }}/x86-fallback-results/
