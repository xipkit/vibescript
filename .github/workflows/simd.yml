name: Rune layout diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Isolate function placement while keeping other text addresses fixed
        run: python3 -u scripts/rune_alignment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rune-alignment-${{ github.run_id }}
          path: ${{ runner.temp }}/rune-alignment/
