name: SIMD embedding diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7a3ba6469b50c5fa7b43764a70f6fc32d7fb3efa
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 892bc640542acba2d8db7ba93b4ec9b49cd29e76
          path: ascii
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3c1891543e6fc02cefb1548d0d04af3dde0d7d55
          path: head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: head/go.sum
      - name: Compare ordinary embedding executables
        run: python3 -u diagnostic/scripts/simd_embedding_measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-${{ github.run_id }}
          path: ${{ runner.temp }}/embedding-results/
