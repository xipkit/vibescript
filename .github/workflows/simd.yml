name: Memory CPU diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [layout, embedding]
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5c83feb3e2427483af06e2818910d9c634a7cbf4
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ea4204d08c789bb5930adedc6d6437d25abef75f
          path: head
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.mode == 'embedding'
        with:
          ref: ac4309513f31f6f7d4f41936027bfa7b08b5601f
          path: merged-base
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.mode == 'embedding'
        with:
          path: merged-head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: head/go.sum
      - name: Measure native x86 control behavior
        run: python3 -u diagnostic/scripts/memory_cpu_measure.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/memory-${{ matrix.mode }}-results/
