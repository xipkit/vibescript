name: SIMD embedding diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7a3ba6469b50c5fa7b43764a70f6fc32d7fb3efa
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 64bb2d461c8626db82e5128c65c77a310ff40379
          path: ascii
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e487e2d6841a90c59ebe8aae1d5458164bc71661
          path: head
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: head/go.sum
      - name: Compare ordinary embedding executables
        run: python3 -u diagnostic/scripts/simd_embedding_measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedding-${{ github.run_id }}
          path: ${{ runner.temp }}/embedding-results/
