name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Install Just
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run tests (Just)
        if: runner.os != 'Windows'
        run: just test

      - name: Run lint (Just)
        if: runner.os != 'Windows'
        run: just lint

      - name: Check cold casefold module lookup
        if: runner.os == 'Linux'
        run: bash ./scripts/check_module_casefold.sh

      - name: Check Vibe formatting
        if: runner.os != 'Windows'
        run: go run ./cmd/vibes fmt -check .

      - name: Check zero-arg paren style
        if: runner.os != 'Windows'
        run: ./scripts/check_vibe_zero_arg_parens.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./...

      - name: Check formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: golangci-lint fmt --diff

      - name: Check Vibe formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go run ./cmd/vibes fmt -check .

      - name: Check zero-arg paren style (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/check_vibe_zero_arg_parens.sh

      - name: Run golangci-lint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: golangci-lint run --timeout=10m

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -timeout 30m ./... -coverprofile=coverage.out -coverpkg=./... -covermode=atomic

      - name: Enforce coverage gate
        run: ./scripts/check_coverage.sh coverage.out 75.0

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f coverage.out ]]; then
            {
              echo "## Test Coverage"
              echo ""
              echo '```text'
              go tool cover -func=coverage.out | tail -n 1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile-${{ github.run_number }}
          path: coverage.out
          if-no-files-found: warn

  race-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run race detector
        run: go test -timeout 30m -race ./...

  goroutine-leak-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run goroutine leak profile
        run: GOEXPERIMENT=goroutineleakprofile go test ./internal/runtime

  estimator-oracle:
    # The memory-quota estimator is a sandboxing boundary: an under-count is a
    # memory-exhaustion escape. Its incremental optimizations (base-walk memo,
    # dormant frames, block-iteration region) ship always-on and must be
    # byte-identical to the exact reference walk. This job runs the runtime suite
    # (which replays the committed fuzz corpus and the differential battery) with
    # the per-check differential oracle and env-recycle poison enabled, so any
    # regression that under-counts or misuses a recycled frame fails the PR.
    runs-on: ubuntu-latest
    env:
      VIBES_ESTIMATOR_VERIFY: "1"
      VIBES_ENV_RECYCLE_VERIFY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Runtime suite under estimator oracle + env-recycle poison
        run: go test -timeout 20m ./internal/runtime -count=1

      - name: Oracle fuzz gate (estimator-exercising target)
        run: go test ./internal/runtime -run '^$' -fuzz=FuzzGeneratedScriptSemantics -fuzztime=20000x

  collection-copy-oracle:
    # Arrays and hashes are values (ADR-006 item 2), implemented with
    # copy-on-write rather than a copy per binding. That trades one bug class
    # for speed: a store that creates a durable handle without publishing it
    # leaves a wrapper looking exclusively held, and a later write mutates in
    # place something another binding can still see. Such a store is invisible
    # until some write happens to reach it, so no ordinary test finds it.
    #
    # Copy-per-write is the reference semantics the ref state optimizes, so this
    # job runs the runtime suite with every addressable write copying its whole
    # path. Any test that passes one way and fails the other is a missing
    # publish site. The cost-measuring tests skip themselves under it, since the
    # oracle changes every byte charged and every step taken by design.
    runs-on: ubuntu-latest
    env:
      VIBES_COW_ALWAYS_COPY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Runtime suite under the always-copy collection oracle
        run: go test -timeout 20m ./internal/runtime -count=1

      - name: Oracle fuzz gate (semantics target)
        run: go test ./internal/runtime -run '^$' -fuzz=FuzzGeneratedScriptSemantics -fuzztime=20000x

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gate examples coverage
        run: go test ./internal/runtime -run 'TestExamples|TestDocsExampleSnippetsCompile'

      - name: Gate Markdown snippet coverage
        run: go test ./internal/tools/analyze -run TestMarkdownVibeSnippetsAreCovered

      - name: Gate known-issues bug bar
        run: ./scripts/check_known_issues.sh

      # The release matrix in .goreleaser.yaml builds 386 alongside amd64 and
      # arm64, and nothing else here compiles for a 32-bit target. Sizes the
      # accounting derives from structs change with the word size, so an
      # architecture-dependent mistake in them was reachable only by the release
      # build until this step existed. Building is enough: it is the compile-time
      # assertions that catch this class, and the tests pin byte figures that are
      # 64-bit by construction.
      - name: Gate 32-bit and big-endian builds
        run: |
          for pair in linux/386 windows/386 linux/arm linux/mips; do
            GOOS="${pair%/*}" GOARCH="${pair#*/}" go build ./... || exit 1
          done

      - name: Gate embedding templates compile
        run: ./scripts/check_embedding_templates.sh

      - name: Gate parser fuzz target
        run: go test ./internal/runtime -run '^$' -fuzz=FuzzCompileScriptDoesNotPanic -fuzztime=10000x

      - name: Gate runtime fuzz target
        run: go test ./internal/runtime -run '^$' -fuzz=FuzzRuntimeEdgeCasesDoNotPanic -fuzztime=10000x
