[package]
name = "vibescript-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Formatter, analyzer, test runner, REPL session and language server for Vibescript"
license = "MIT AND BSD-3-Clause"
publish = false

[features]
default = ["lsp"]
lsp = []

[dependencies]
vibescript = { path = "..", default-features = false }

[lints]
workspace = true
