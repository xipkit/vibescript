[package]
name = "vibes"
version = "0.80.1"
edition = "2024"
rust-version = "1.85"
description = "Command-line tools for the Vibescript interpreter"
license = "MIT AND BSD-3-Clause"
publish = false

[features]
default = ["simd"]
simd = ["vibescript/simd"]
allocation-stats = ["vibescript/allocation-stats"]
tokio = ["vibescript/tokio"]

[dependencies]
unicode-width = "0.2"
vibescript = { path = "..", default-features = false }
vibescript-tools = { path = "../tools" }

# The interactive REPL needs a terminal and fmt pins directories with cap-std
# handles; WASI builds use the REPL's line mode and rustix handles.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
cap-std = "4.0.3"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }

# WASI's std has no stable device and inode, and wasi-libc's `openat` cannot
# request write rights through a directory that is not a preopen.
[target.'cfg(target_os = "wasi")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
wasi = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows reports file IDs only through a handle.
[target.'cfg(windows)'.dependencies]
cap-fs-ext = "4.0.3"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "vibes"
path = "src/main.rs"

[lints]
workspace = true
