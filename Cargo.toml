[workspace]
members = ["cli", "tools"]
# The WASI witness is its own package with its own lock file.
exclude = ["tests/platforms/wasi"]

# Rules come in one at a time: each rule in `allow` has its own card. The test
# directories do their work in helpers, which the test exemption doesn't cover.
[workspace.metadata.adamantium]
skip = ["tests/", "cli/tests/", "tools/tests/"]
allow = [
  "indexing_slicing", "unwrap_used",
]

# The parser and compiler use `async fn` for stack-safe recursion, not
# concurrency.
[workspace.metadata.adamantium.exceptions]
future_not_send = ["src/syntax.rs", "src/syntax/", "src/bytecode.rs", "src/bytecode/", "src/compilation/tasks.rs"]
unsafe_code = [
  # SIMD intrinsics and the tagged, one-word Arc byte handle.
  "src/scan.rs", "src/json/scan.rs", "src/value/bytes.rs",
  # Platform filesystem, timezone and signal APIs.
  "src/loading/files/platform.rs", "src/loading/files/platform/windows.rs",
  "src/time/zone/windows.rs", "cli/src/files.rs", "cli/src/signal.rs",
  # Filesystem tests create FIFOs and inspect descriptor flags through libc.
  "src/loading/files/tests.rs",
  # Diagnostic allocators, allocator statistics and resident memory queries.
  "examples/compare.rs", "examples/footprint/allocations.rs",
  "examples/footprint/snapshot.rs", "examples/footprint/rss.rs",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "vibescript"
version = "0.90.0"
edition = "2024"
rust-version = "1.85"
description = "An embeddable, metered, statically typed scripting language"
license = "MIT AND BSD-3-Clause"
publish = false
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

# Allocation snapshots must not include work from unrelated tests.
[[test]]
name = "footprint"
path = "tests/footprint.rs"

# The checker's own memory account, measured by a counting allocator.
[[test]]
name = "checker_footprint"
path = "tests/checker_footprint.rs"

[features]
default = ["simd"]
simd = []
allocation-stats = []
tokio = ["dep:tokio"]

[dependencies]
getrandom = "0.4"
memchr = "2.8"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"

[target.'cfg(target_os = "wasi")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }

# WASI preview 1 has no threads, so its tests build without the Tokio runner.
[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
overflow-checks = true

# Tests and gates: release optimizations and overflow behaviour, but with
# parallel code generation, since single-unit LTO builds dominated gate time.
# Benchmarks and shipped binaries keep the release profile.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[profile.playground]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
debug = 0

[lints]
workspace = true
