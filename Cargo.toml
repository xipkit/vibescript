[package]
name = "vibescript"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An experimental metered Vibescript interpreter in Rust"
license = "MIT AND BSD-3-Clause"
publish = false

[features]
default = ["simd"]
simd = []
allocation-stats = []
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[bin]]
name = "vibes"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
